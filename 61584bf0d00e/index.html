<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="theme-color" content="#2D2520">
<script>
/* Resolve the theme before first paint so a light user never sees a dark flash. */
try {
    var t = localStorage.getItem('gymlog.theme') || 'dark';
    if (t === 'system') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
    document.documentElement.dataset.theme = t;
    if (t === 'light') document.querySelector('meta[name=theme-color]').content = '#F7F2EA';
} catch (e) {}
</script>
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Gym Log</title>
<style>
/* Dark is the default palette; the head script always stamps an explicit
   data-theme, so [data-theme=dark] repeats it for when the toggle sets it back. */
:root, :root[data-theme="dark"] {
    --bg: #2D2520;
    --bg2: #3D3530;
    --bg3: #4A413A;
    --line: transparent;
    --fg: #F5F0E8;
    --muted: #B8B0A8;
    --acc: #E8922D;          /* fills: buttons, active segment */
    --acc-text: #E8922D;     /* accent as text/icon — needs contrast on the page bg */
    --acc-dark: #C97A1F;
    --ok: #6BB56B;
    --on-ok: #1E2A1E;
    --danger: #D9645F;
    --scrim: rgba(0, 0, 0, .55);
}

:root[data-theme="light"] {
    --bg: #F7F2EA;
    --bg2: #FFFFFF;
    --bg3: #E4DACC;
    --line: #E4DACC;
    --fg: #2B2420;
    --muted: #6E6257;
    --acc: #C97A1F;
    --acc-text: #96540F;     /* darker: the 11px active nav label must stay legible */
    --acc-dark: #A96214;
    --ok: #357A3A;
    --on-ok: #FFFFFF;
    --danger: #C0392B;
    --scrim: rgba(43, 36, 32, .45);
}

:root {
    --r: 12px;
    --nav-h: 60px;
    color-scheme: dark light;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html { -webkit-text-size-adjust: 100%; }

body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--fg);
    line-height: 1.5;
    min-height: 100dvh;
    overscroll-behavior-y: contain;
    -webkit-tap-highlight-color: transparent;
}

button, input, select { font: inherit; color: inherit; touch-action: manipulation; }
button { background: none; border: none; cursor: pointer; }

/* ===== Shell ===== */
#app { padding-bottom: calc(var(--nav-h) + env(safe-area-inset-bottom) + 12px); }

.topbar {
    position: sticky; top: 0; z-index: 20;
    display: flex; align-items: center; gap: 12px;
    padding: calc(env(safe-area-inset-top) + 12px) 16px 12px;
    background: var(--bg);
    border-bottom: 1px solid var(--bg3);
}
.topbar h1 { font-size: 19px; font-weight: 600; flex: 1; }
.topbar .sub { font-size: 13px; color: var(--muted); font-weight: 400; }

main { padding: 16px; display: flex; flex-direction: column; gap: 12px; }

/* ===== Bottom nav ===== */
nav {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 30;
    display: flex;
    background: var(--bg2);
    border-top: 1px solid var(--bg3);
    padding-bottom: env(safe-area-inset-bottom);
}
nav button {
    flex: 1; height: var(--nav-h);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
    color: var(--muted); font-size: 11px;
}
nav button svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
nav button.active { color: var(--acc-text); }

/* ===== Generic bits ===== */
.card { background: var(--bg2); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; }
.row { display: flex; align-items: center; gap: 12px; }
.grow { flex: 1; min-width: 0; }
.muted { color: var(--muted); font-size: 13px; }
.truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.btn {
    background: var(--acc); color: #241C16; font-weight: 600;
    border-radius: var(--r); padding: 14px 18px; min-height: 48px;
    display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%;
}
.btn:active { background: var(--acc-dark); }
.btn.ghost { background: var(--bg2); color: var(--fg); border: 1px solid var(--bg3); }
.btn.ghost:active { background: var(--bg3); }
.btn.danger { background: none; color: var(--danger); border: 1px solid var(--danger); }
.btn.sm { min-height: 40px; padding: 8px 14px; font-size: 14px; width: auto; }

.iconbtn {
    width: 40px; height: 40px; flex: none;
    display: flex; align-items: center; justify-content: center;
    border-radius: 10px; color: var(--muted); font-size: 18px;
}
.iconbtn:active { background: var(--bg3); }
.iconbtn:disabled { opacity: .3; }

.empty { text-align: center; color: var(--muted); padding: 36px 20px; font-size: 15px; }
.empty strong { display: block; color: var(--fg); font-size: 17px; margin-bottom: 6px; }

.tag {
    font-size: 11px; text-transform: uppercase; letter-spacing: .06em;
    color: var(--muted); background: var(--bg3); padding: 2px 7px; border-radius: 999px;
}
h2.section { font-size: 13px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); margin-top: 8px; }

input[type=text], input[type=number] {
    background: var(--bg); border: 1px solid var(--bg3); border-radius: 10px;
    padding: 12px; font-size: 16px; width: 100%;
}
input:focus { outline: 2px solid var(--acc-text); outline-offset: -1px; }
input[type=number] { -moz-appearance: textfield; text-align: center; }
input[type=number]::-webkit-outer-spin-button,
input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
/* Must out-specify input[type=number] above, or these render full-width. */
input.num { width: 72px; flex: 0 1 72px; min-width: 0; padding: 10px 4px; }

/* Labelled number fields — used for cardio and in the template editor. */
.fields { display: grid; gap: 10px; grid-template-columns: repeat(var(--cols, 2), minmax(0, 1fr)); }
.fld { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.fld span { font-size: 12px; color: var(--muted); }
.fld input.num { width: 100%; flex: none; padding: 11px 4px; }

/* ===== Workout entries ===== */
.entry { background: var(--bg2); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.entry.done { border-left: 3px solid var(--ok); }
.entry-head { display: flex; align-items: center; gap: 12px; padding: 12px 14px; }
.check {
    width: 30px; height: 30px; flex: none; border-radius: 50%;
    border: 2px solid var(--bg3); color: transparent; font-size: 15px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
}
.entry.done .check { background: var(--ok); border-color: var(--ok); color: var(--on-ok); }
.entry-main { flex: 1; min-width: 0; text-align: left; }
.entry-name { font-weight: 600; font-size: 15px; }
.entry-sub { font-size: 13px; color: var(--muted); }
.entry-body { padding: 0 14px 12px; display: none; flex-direction: column; gap: 8px; }
.entry.open .entry-body { display: flex; }

/* ===== Sheet ===== */
.sheet-wrap {
    position: fixed; inset: 0; z-index: 50;
    background: var(--scrim);
    display: flex; align-items: flex-end;
}
.sheet-wrap[hidden] { display: none; }
.sheet {
    background: var(--bg2); width: 100%;
    border-radius: 18px 18px 0 0;
    padding: 18px 16px calc(18px + env(safe-area-inset-bottom));
    max-height: 88dvh; overflow-y: auto;
    display: flex; flex-direction: column; gap: 12px;
    animation: up .18s ease-out;
}
@keyframes up { from { transform: translateY(14px); opacity: .6 } }
.sheet h2 { font-size: 17px; }
.pick { display: flex; align-items: center; gap: 12px; padding: 13px 12px; background: var(--bg); border-radius: 10px; width: 100%; text-align: left; }
.pick:active { background: var(--bg3); }

.seg { display: flex; background: var(--bg); border-radius: 10px; padding: 4px; gap: 4px; }
.seg button { flex: 1; padding: 10px; border-radius: 8px; font-size: 14px; color: var(--muted); }
.seg button.on { background: var(--acc); color: #241C16; font-weight: 600; }

.hist-row { display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--bg3); font-size: 14px; }
.hist-row:last-child { border-bottom: none; }
</style>
</head>
<body>

<div id="app">
    <div class="topbar">
        <h1 id="title">Workout</h1>
        <div class="sub" id="subtitle"></div>
    </div>
    <main id="main"></main>
</div>

<nav id="nav">
    <button data-view="workout" class="active">
        <svg viewBox="0 0 24 24"><path d="M6 9v6M18 9v6M3 10v4M21 10v4M6 12h12"/></svg>
        Workout
    </button>
    <button data-view="templates">
        <svg viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>
        Templates
    </button>
    <button data-view="activities">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
        Activities
    </button>
    <button data-view="journal">
        <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
        Journal
    </button>
    <button data-view="settings">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 14.5a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1.03 1.56V21a2 2 0 1 1-4 0v-.1A1.7 1.7 0 0 0 8.9 19.3a1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.7 1.7 0 0 0 .34-1.87 1.7 1.7 0 0 0-1.56-1.03H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.56-1.13 1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.87.34H9a1.7 1.7 0 0 0 1.03-1.56V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1.03 1.56 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87V9a1.7 1.7 0 0 0 1.56 1.03H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1.03z"/></svg>
        Settings
    </button>
</nav>

<div class="sheet-wrap" id="sheetWrap" hidden><div class="sheet" id="sheet"></div></div>

<script>
'use strict';

/* ============================ State ============================ */

const KEY = 'gymlog.v1';
const uid = () => Math.random().toString(36).slice(2, 10);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => (
    { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function blank() {
    return { schema: 1, activities: [], templates: [], sessions: [], current: null };
}

function load() {
    try {
        const raw = localStorage.getItem(KEY);
        if (!raw) return blank();
        const s = JSON.parse(raw);
        return Object.assign(blank(), s);
    } catch (e) {
        console.error('Could not read saved data', e);
        return blank();
    }
}

let state = load();
let view = 'workout';
let tick = null;

function save() {
    try {
        localStorage.setItem(KEY, JSON.stringify(state));
    } catch (e) {
        alert('Could not save — device storage may be full.');
    }
}

/* ============================ Theme ============================ */

/* Kept out of `state` on purpose: it's a per-device preference, so importing a
   backup from another phone must not drag its appearance along. */
const THEME_KEY = 'gymlog.theme';
const THEME_BG = { light: '#F7F2EA', dark: '#2D2520' };
const THEMES = [['system', 'System'], ['light', 'Light'], ['dark', 'Dark']];

let theme = 'dark';
try { theme = localStorage.getItem(THEME_KEY) || 'dark'; } catch (e) {}

function resolveTheme(t) {
    if (t !== 'system') return t;
    return window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
}

function applyTheme() {
    const t = resolveTheme(theme);
    document.documentElement.dataset.theme = t;
    const meta = document.querySelector('meta[name=theme-color]');
    if (meta) meta.content = THEME_BG[t];
}

function setTheme(t) {
    theme = t;
    try { localStorage.setItem(THEME_KEY, t); } catch (e) {}
    applyTheme();
    render();
}

const actById = (id) => state.activities.find((a) => a.id === id);
const liveActs = () => state.activities.filter((a) => !a.archived);

/* Most recent completed entry for an activity, for prefilling. */
function lastEntry(activityId) {
    for (let i = state.sessions.length - 1; i >= 0; i--) {
        const e = state.sessions[i].entries.find((x) => x.activityId === activityId);
        if (e) return e;
    }
    return null;
}

/* ============================ Formatting ============================ */

const num = (v) => (Math.round(v * 100) / 100).toString();

function entrySummary(e) {
    if (e.kind === 'cardio') {
        const bits = [];
        if (e.minutes) bits.push(num(e.minutes) + ' min');
        if (e.km) bits.push(num(e.km) + ' km');
        return bits.join('  ·  ') || 'no numbers yet';
    }
    if (!e.sets.length) return 'no sets';
    const same = e.sets.every((s) => s.reps === e.sets[0].reps && s.weight === e.sets[0].weight);
    if (same) return e.sets.length + ' × ' + num(e.sets[0].reps) + ' @ ' + num(e.sets[0].weight) + ' kg';
    return e.sets.map((s) => num(s.reps) + '×' + num(s.weight)).join(', ') + ' kg';
}

function volume(session) {
    return session.entries.reduce((t, e) => t + (e.kind === 'strength'
        ? e.sets.reduce((v, s) => v + (s.reps || 0) * (s.weight || 0), 0) : 0), 0);
}

function fmtDur(ms) {
    const m = Math.max(0, Math.round(ms / 60000));
    return m < 60 ? m + ' min' : Math.floor(m / 60) + 'h ' + String(m % 60).padStart(2, '0');
}

function fmtDate(iso) {
    return new Date(iso).toLocaleDateString(undefined, { weekday: 'short', day: 'numeric', month: 'short' });
}

/* ============================ Sheet ============================ */

const sheetWrap = document.getElementById('sheetWrap');
const sheet = document.getElementById('sheet');

function openSheet(html) {
    sheet.innerHTML = html;
    sheetWrap.hidden = false;
}
function closeSheet() {
    sheetWrap.hidden = true;
    sheet.innerHTML = '';
}
sheetWrap.addEventListener('click', (e) => { if (e.target === sheetWrap) closeSheet(); });

/* ============================ Render ============================ */

const main = document.getElementById('main');
const titleEl = document.getElementById('title');
const subtitleEl = document.getElementById('subtitle');

function render() {
    if (tick) { clearInterval(tick); tick = null; }
    document.querySelectorAll('#nav button').forEach((b) =>
        b.classList.toggle('active', b.dataset.view === view));
    subtitleEl.textContent = '';
    ({ workout: renderWorkout, templates: renderTemplates, activities: renderActivities, journal: renderJournal, settings: renderSettings })[view]();
    window.scrollTo(0, 0);
}

/* ---------- Workout ---------- */

function renderWorkout() {
    const cur = state.current;
    titleEl.textContent = cur ? cur.templateName : 'Start a workout';

    if (!cur) {
        const tpls = state.templates.map((t) => `
            <button class="card row" data-act="start" data-id="${t.id}" style="width:100%;text-align:left">
                <div class="grow">
                    <div style="font-weight:600">${esc(t.name)}</div>
                    <div class="muted">${t.items.length} ${t.items.length === 1 ? 'activity' : 'activities'}</div>
                </div>
                <span style="color:var(--acc-text);font-size:20px">▸</span>
            </button>`).join('');

        main.innerHTML = (tpls || `<div class="empty">
                <strong>No templates yet</strong>
                Build a day — Leg Day, Upper Body — in the Templates tab, then start it here.
            </div>`)
            + `<button class="btn ghost" data-act="start-empty" style="margin-top:8px">Start an empty workout</button>`;
        return;
    }

    const rows = cur.entries.map((e, i) => `
        <div class="entry ${e.done ? 'done' : ''} ${e.open ? 'open' : ''}" data-i="${i}">
            <div class="entry-head">
                <button class="check" data-act="toggle" data-i="${i}" aria-label="Mark done">✓</button>
                <button class="entry-main" data-act="expand" data-i="${i}">
                    <div class="entry-name truncate">${esc(e.name)}</div>
                    <div class="entry-sub truncate">${esc(entrySummary(e))}</div>
                </button>
                <button class="iconbtn" data-act="history" data-i="${i}" aria-label="History">↻</button>
            </div>
            <div class="entry-body">${e.kind === 'strength' ? strengthBody(e, i) : cardioBody(e, i)}</div>
        </div>`).join('');

    main.innerHTML = `
        ${rows || '<div class="empty"><strong>Nothing added</strong>Add an activity to get going.</div>'}
        <button class="btn ghost" data-act="add-to-workout">+ Add activity</button>
        <button class="btn" data-act="finish" style="margin-top:8px">Finish workout</button>
        <button class="btn ghost" data-act="discard">Discard</button>`;

    const paint = () => { subtitleEl.textContent = fmtDur(Date.now() - new Date(cur.startedAt).getTime()); };
    paint();
    tick = setInterval(paint, 20000);
}

/* Every set is the same reps × weight, so the entry is edited as one row.
   Sessions still store a `sets` array, which keeps older varied logs readable. */
function strengthBody(e, i) {
    const first = e.sets[0] || { reps: 10, weight: 0 };
    const fld = (label, field, val, step, mode) => `<label class="fld"><span>${label}</span>
        <input class="num" type="number" inputmode="${mode}" step="${step}" min="0" value="${val}"
               data-i="${i}" data-field="${field}"></label>`;
    return `<div class="fields" style="--cols:3">
            ${fld('Sets', 'sets', e.sets.length, 1, 'numeric')}
            ${fld('Reps', 'reps', first.reps, 1, 'numeric')}
            ${fld('kg', 'weight', first.weight, 0.5, 'decimal')}
        </div>`;
}

/* Rewrite the sets as n identical copies of the current reps × weight. */
function setStrength(e, field, v) {
    const base = Object.assign({ reps: 10, weight: 0 }, e.sets[0]);
    let n = e.sets.length;
    if (field === 'sets') n = Math.max(1, Math.round(v));
    else base[field] = v;
    e.sets = Array.from({ length: n }, () => ({ reps: base.reps, weight: base.weight }));
}

function cardioBody(e, i) {
    return `
        <div class="fields">
            <label class="fld"><span>Minutes</span>
                <input class="num" type="number" inputmode="decimal" step="1" min="0" value="${e.minutes}"
                       data-i="${i}" data-field="minutes">
            </label>
            <label class="fld"><span>Distance (km)</span>
                <input class="num" type="number" inputmode="decimal" step="0.1" min="0" value="${e.km}"
                       data-i="${i}" data-field="km">
            </label>
        </div>`;
}

/* ---------- Templates ---------- */

function renderTemplates() {
    titleEl.textContent = 'Templates';
    const list = state.templates.map((t) => `
        <div class="card row">
            <button class="grow" data-act="edit-tpl" data-id="${t.id}" style="text-align:left">
                <div style="font-weight:600">${esc(t.name)}</div>
                <div class="muted truncate">${t.items.length ? esc(t.items.map((it) => (actById(it.activityId) || {}).name || '?').join(', ')) : 'empty'}</div>
            </button>
            <button class="iconbtn" data-act="del-tpl" data-id="${t.id}" aria-label="Delete">🗑</button>
        </div>`).join('');

    main.innerHTML = (list || `<div class="empty">
            <strong>No templates yet</strong>
            A template is one day's plan — Leg Day, Upper Body, Cardio.
        </div>`)
        + `<button class="btn" data-act="new-tpl">+ New template</button>`;
}

function editTemplate(id) {
    const t = state.templates.find((x) => x.id === id);
    if (!t) return;

    const items = t.items.map((it, j) => {
        const a = actById(it.activityId);
        if (!a) return '';
        const fld = (label, tf, val, step) => `<label class="fld"><span>${label}</span>
            <input class="num" type="number" inputmode="decimal" step="${step}" min="0" value="${val}"
                   data-j="${j}" data-tf="${tf}"></label>`;
        const fields = a.kind === 'strength'
            ? `<div class="fields" style="--cols:3">
                   ${fld('Sets', 'sets', it.sets, 1)}
                   ${fld('Reps', 'reps', it.reps, 1)}
                   ${fld('kg', 'weight', it.weight, 0.5)}
               </div>`
            : `<div class="fields">
                   ${fld('Minutes', 'minutes', it.minutes, 1)}
                   ${fld('Distance (km)', 'km', it.km, 0.1)}
               </div>`;
        return `<div class="card" style="display:flex;flex-direction:column;gap:10px">
                <div class="row">
                    <div class="grow truncate" style="font-weight:600">${esc(a.name)}</div>
                    <button class="iconbtn" data-act="tpl-move" data-j="${j}" data-dir="-1" aria-label="Move up" ${j === 0 ? 'disabled' : ''}>↑</button>
                    <button class="iconbtn" data-act="tpl-move" data-j="${j}" data-dir="1" aria-label="Move down" ${j === t.items.length - 1 ? 'disabled' : ''}>↓</button>
                    <button class="iconbtn" data-act="tpl-remove" data-j="${j}" aria-label="Remove">×</button>
                </div>
                ${fields}
            </div>`;
    }).join('');

    openSheet(`
        <h2>Edit template</h2>
        <input type="text" id="tplName" value="${esc(t.name)}" placeholder="Leg Day" data-act="tpl-name">
        ${items || '<div class="muted" style="text-align:center;padding:12px">No activities yet.</div>'}
        <button class="btn ghost" data-act="tpl-add">+ Add activity</button>
        <button class="btn" data-act="tpl-done">Done</button>`);
    sheet.dataset.tpl = id;
}

/* ---------- Activities ---------- */

function renderActivities() {
    titleEl.textContent = 'Activities';

    const group = (kind, label) => {
        const rows = state.activities.filter((a) => a.kind === kind && !a.archived).map((a) => `
            <div class="card row">
                <button class="grow truncate" data-act="rename-act" data-id="${a.id}" style="text-align:left">${esc(a.name)}</button>
                <button class="iconbtn" data-act="archive-act" data-id="${a.id}" aria-label="Archive">✕</button>
            </div>`).join('');
        return rows ? `<h2 class="section">${label}</h2>${rows}` : '';
    };

    const archived = state.activities.filter((a) => a.archived);
    const archBlock = archived.length ? `
        <h2 class="section">Archived</h2>
        ${archived.map((a) => `<div class="card row">
            <div class="grow truncate muted">${esc(a.name)}</div>
            <button class="btn ghost sm" data-act="unarchive-act" data-id="${a.id}">Restore</button>
        </div>`).join('')}` : '';

    const body = group('strength', 'Machines & weights') + group('cardio', 'Cardio');
    main.innerHTML = (body || `<div class="empty">
            <strong>No activities yet</strong>
            Add the machines you use and any cardio — walking, running, bike.
        </div>`)
        + `<button class="btn" data-act="new-act" style="margin-top:8px">+ Add activity</button>`
        + archBlock;
}

/* ---------- Journal ---------- */

function renderJournal() {
    titleEl.textContent = 'Journal';

    const list = state.sessions.slice().reverse().map((s) => {
        const vol = volume(s);
        return `<div class="card" style="display:flex;flex-direction:column;gap:8px">
            <div class="row">
                <div class="grow">
                    <div style="font-weight:600">${esc(s.templateName)}</div>
                    <div class="muted">${fmtDate(s.startedAt)} · ${fmtDur(new Date(s.endedAt) - new Date(s.startedAt))}${vol ? ' · ' + Math.round(vol).toLocaleString() + ' kg total' : ''}</div>
                </div>
                <button class="iconbtn" data-act="del-session" data-id="${s.id}" aria-label="Delete">🗑</button>
            </div>
            ${s.entries.map((e) => `<div class="hist-row">
                <span class="truncate">${esc(e.name)}</span>
                <span class="muted" style="flex:none">${esc(entrySummary(e))}</span>
            </div>`).join('')}
        </div>`;
    }).join('');

    main.innerHTML = list || `<div class="empty">
            <strong>No workouts logged yet</strong>
            Finished workouts land here.
        </div>`;
}

/* ---------- Settings ---------- */

function renderSettings() {
    titleEl.textContent = 'Settings';

    main.innerHTML =
        `<h2 class="section">Appearance</h2>
         <div class="seg">${THEMES.map(([v, label]) =>
             `<button data-act="theme" data-theme="${v}" class="${theme === v ? 'on' : ''}">${label}</button>`).join('')}</div>
         <h2 class="section">Data</h2>
         <button class="btn ghost" data-act="export">Export backup</button>
         <button class="btn ghost" data-act="import">Import backup</button>
         <div class="muted" style="text-align:center;padding:4px 8px 0">
           Everything is stored on this device only. Export now and then so a cleared browser doesn't take your history with it.
         </div>
         <div id="installSlot"></div>`;

    if (deferredInstall) {
        document.getElementById('installSlot').innerHTML =
            '<button class="btn" data-act="install" style="margin-top:12px">Add to home screen</button>';
    }
}

/* ============================ Actions ============================ */

function startWorkout(tpl) {
    const entries = (tpl ? tpl.items : []).map((it) => makeEntry(it.activityId, it)).filter(Boolean);
    state.current = {
        id: uid(),
        templateId: tpl ? tpl.id : null,
        templateName: tpl ? tpl.name : 'Workout',
        startedAt: new Date().toISOString(),
        entries: entries
    };
    save();
    view = 'workout';
    render();
}

/* Build a session entry, prefilled from last time if available, else from the template target. */
function makeEntry(activityId, target) {
    const a = actById(activityId);
    if (!a) return null;
    const last = lastEntry(activityId);
    const base = { activityId: a.id, name: a.name, kind: a.kind, done: false, open: false };

    if (a.kind === 'strength') {
        let sets;
        if (last && last.sets && last.sets.length) {
            /* Older logs may have varied sets; carry the final (working) set forward. */
            const ls = last.sets[last.sets.length - 1];
            sets = last.sets.map(() => ({ reps: ls.reps, weight: ls.weight }));
        } else {
            const n = Math.max(1, (target && target.sets) || 3);
            sets = Array.from({ length: n }, () => ({
                reps: (target && target.reps) || 10,
                weight: (target && target.weight) || 0
            }));
        }
        return Object.assign(base, { sets: sets });
    }
    return Object.assign(base, {
        minutes: last ? last.minutes : (target && target.minutes) || 0,
        km: last ? last.km : (target && target.km) || 0
    });
}

function finishWorkout() {
    const cur = state.current;
    const done = cur.entries.filter((e) => e.done);
    if (!done.length) {
        alert('Nothing is checked off yet — tap the circle next to each activity you finished.');
        return;
    }
    if (!confirm('Finish and save this workout?')) return;

    state.sessions.push({
        id: cur.id,
        templateId: cur.templateId,
        templateName: cur.templateName,
        startedAt: cur.startedAt,
        endedAt: new Date().toISOString(),
        entries: done.map((e) => {
            const c = Object.assign({}, e);
            delete c.open; delete c.done;
            return c;
        })
    });
    state.current = null;
    save();
    view = 'journal';
    render();
}

function pickActivity(onPick, filterFn) {
    const list = liveActs().filter(filterFn || (() => true));
    if (!list.length) {
        alert('No activities yet — add some in the Activities tab first.');
        return;
    }
    openSheet(`<h2>Pick an activity</h2>` + list.map((a) => `
        <button class="pick" data-act="picked" data-id="${a.id}">
            <span class="grow truncate">${esc(a.name)}</span>
            <span class="tag">${a.kind === 'strength' ? 'weights' : 'cardio'}</span>
        </button>`).join(''));
    pickHandler = onPick;
}
let pickHandler = null;

function newActivitySheet() {
    openSheet(`
        <h2>New activity</h2>
        <input type="text" id="actName" placeholder="Leg Press, Treadmill Walk…" autocomplete="off">
        <div class="seg" id="actKind">
            <button data-kind="strength" class="on">Machine / weights</button>
            <button data-kind="cardio">Cardio</button>
        </div>
        <button class="btn" data-act="save-act">Add</button>`);
    setTimeout(() => document.getElementById('actName').focus(), 50);
}

function showHistory(activityId, name) {
    const rows = [];
    for (let i = state.sessions.length - 1; i >= 0 && rows.length < 8; i--) {
        const s = state.sessions[i];
        const e = s.entries.find((x) => x.activityId === activityId);
        if (e) rows.push(`<div class="hist-row">
            <span class="muted">${fmtDate(s.startedAt)}</span>
            <span>${esc(entrySummary(e))}</span>
        </div>`);
    }
    openSheet(`<h2>${esc(name)}</h2>` +
        (rows.join('') || '<div class="muted" style="padding:8px 0">No history yet — this is the first time.</div>') +
        `<button class="btn ghost" data-act="close-sheet" style="margin-top:8px">Close</button>`);
}

/* ---------- Export / import ---------- */

function exportData() {
    const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'gymlog-' + new Date().toISOString().slice(0, 10) + '.json';
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

function importData() {
    const inp = document.createElement('input');
    inp.type = 'file';
    inp.accept = 'application/json,.json';
    inp.onchange = () => {
        const file = inp.files[0];
        if (!file) return;
        const fr = new FileReader();
        fr.onload = () => {
            try {
                const data = JSON.parse(fr.result);
                if (!data || !Array.isArray(data.activities) || !Array.isArray(data.sessions)) {
                    throw new Error('not a gym log backup');
                }
                if (!confirm('Replace everything on this device with the backup?')) return;
                state = Object.assign(blank(), data);
                save();
                render();
            } catch (e) {
                alert("That file doesn't look like a Gym Log backup.");
            }
        };
        fr.readAsText(file);
    };
    inp.click();
}

/* ============================ Events ============================ */

document.getElementById('nav').addEventListener('click', (e) => {
    const b = e.target.closest('button[data-view]');
    if (!b) return;
    view = b.dataset.view;
    render();
});

/* Clicks — one delegated handler for the whole app. */
document.body.addEventListener('click', (e) => {
    const el = e.target.closest('[data-act]');
    if (!el) return;
    const act = el.dataset.act;
    const id = el.dataset.id;
    const i = el.dataset.i !== undefined ? +el.dataset.i : null;
    const cur = state.current;

    switch (act) {

    /* --- starting --- */
    case 'start':
        startWorkout(state.templates.find((t) => t.id === id));
        break;
    case 'start-empty':
        startWorkout(null);
        break;

    /* --- during a workout --- */
    case 'toggle':
        cur.entries[i].done = !cur.entries[i].done;
        if (cur.entries[i].done) cur.entries[i].open = false;
        save(); render();
        break;
    case 'expand':
        cur.entries[i].open = !cur.entries[i].open;
        save(); render();
        break;
    case 'history':
        showHistory(cur.entries[i].activityId, cur.entries[i].name);
        break;
    case 'add-to-workout':
        pickActivity((activityId) => {
            cur.entries.push(makeEntry(activityId, null));
            save(); closeSheet(); render();
        });
        break;
    case 'finish':
        finishWorkout();
        break;
    case 'discard':
        if (confirm('Discard this workout without saving it?')) {
            state.current = null; save(); render();
        }
        break;

    /* --- templates --- */
    case 'new-tpl': {
        const name = prompt('Name this day (Leg Day, Upper Body…)');
        if (!name || !name.trim()) break;
        const t = { id: uid(), name: name.trim(), items: [] };
        state.templates.push(t); save(); render(); editTemplate(t.id);
        break;
    }
    case 'edit-tpl':
        editTemplate(id);
        break;
    case 'del-tpl':
        if (confirm('Delete this template? Logged workouts are not affected.')) {
            state.templates = state.templates.filter((t) => t.id !== id);
            save(); render();
        }
        break;
    case 'tpl-add': {
        const tplId = sheet.dataset.tpl;
        pickActivity((activityId) => {
            const t = state.templates.find((x) => x.id === tplId);
            const a = actById(activityId);
            t.items.push(a.kind === 'strength'
                ? { activityId: activityId, sets: 3, reps: 10, weight: 0 }
                : { activityId: activityId, minutes: 20, km: 0 });
            save(); editTemplate(tplId);
        });
        break;
    }
    case 'tpl-remove': {
        const t = state.templates.find((x) => x.id === sheet.dataset.tpl);
        t.items.splice(+el.dataset.j, 1);
        save(); editTemplate(t.id);
        break;
    }
    case 'tpl-move': {
        const t = state.templates.find((x) => x.id === sheet.dataset.tpl);
        const j = +el.dataset.j, k = j + +el.dataset.dir;
        if (!t || k < 0 || k >= t.items.length) break;
        [t.items[j], t.items[k]] = [t.items[k], t.items[j]];
        save();
        /* Re-rendering the sheet would jump back to the top mid-reorder. */
        const top = sheet.scrollTop;
        editTemplate(t.id);
        sheet.scrollTop = top;
        break;
    }
    case 'tpl-done':
        closeSheet(); render();
        break;

    /* --- activities --- */
    case 'new-act':
        newActivitySheet();
        break;
    case 'save-act': {
        const name = document.getElementById('actName').value.trim();
        if (!name) { alert('Give it a name first.'); break; }
        const kind = sheet.querySelector('#actKind .on').dataset.kind;
        state.activities.push({ id: uid(), name: name, kind: kind, archived: false });
        save(); closeSheet(); render();
        break;
    }
    case 'rename-act': {
        const a = actById(id);
        const name = prompt('Rename activity', a.name);
        if (name && name.trim()) { a.name = name.trim(); save(); render(); }
        break;
    }
    case 'archive-act':
        if (confirm('Remove this from your lists? Past workouts keep it.')) {
            actById(id).archived = true;
            state.templates.forEach((t) => { t.items = t.items.filter((it) => it.activityId !== id); });
            save(); render();
        }
        break;
    case 'unarchive-act':
        actById(id).archived = false;
        save(); render();
        break;

    /* --- journal / data --- */
    case 'del-session':
        if (confirm('Delete this logged workout?')) {
            state.sessions = state.sessions.filter((s) => s.id !== id);
            save(); render();
        }
        break;
    case 'export': exportData(); break;
    case 'import': importData(); break;
    case 'theme': setTheme(el.dataset.theme); break;
    case 'install':
        deferredInstall.prompt();
        deferredInstall = null;
        break;

    /* --- sheet --- */
    case 'picked':
        if (pickHandler) { const h = pickHandler; pickHandler = null; h(id); }
        break;
    case 'close-sheet':
        closeSheet();
        break;
    }
});

/* Segmented control inside the new-activity sheet. */
sheet.addEventListener('click', (e) => {
    const b = e.target.closest('#actKind button');
    if (!b) return;
    sheet.querySelectorAll('#actKind button').forEach((x) => x.classList.toggle('on', x === b));
});

/* Number fields: write straight to state, no re-render, so focus is never stolen. */
document.body.addEventListener('input', (e) => {
    const el = e.target;
    const v = el.value === '' ? 0 : parseFloat(el.value);
    if (isNaN(v)) return;

    if (el.dataset.field && state.current) {
        const entry = state.current.entries[+el.dataset.i];
        if (entry.kind === 'strength') setStrength(entry, el.dataset.field, v);
        else entry[el.dataset.field] = v;
        const sub = main.querySelector('.entry[data-i="' + el.dataset.i + '"] .entry-sub');
        if (sub) sub.textContent = entrySummary(entry);
        save();
    } else if (el.dataset.tf) {
        const t = state.templates.find((x) => x.id === sheet.dataset.tpl);
        if (t) { t.items[+el.dataset.j][el.dataset.tf] = v; save(); }
    } else if (el.dataset.act === 'tpl-name') {
        const t = state.templates.find((x) => x.id === sheet.dataset.tpl);
        if (t) { t.name = el.value; save(); }
    }
});

/* ============================ Boot ============================ */

let deferredInstall = null;
window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredInstall = e;
    if (view === 'settings') render();
});

if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}

/* Follow the phone's day/night switch while set to System. */
if (window.matchMedia) {
    try {
        matchMedia('(prefers-color-scheme: light)')
            .addEventListener('change', () => { if (theme === 'system') applyTheme(); });
    } catch (e) {}
}

applyTheme();
render();
</script>
</body>
</html>
